config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/n8n-io/n8n:
      branch: master
      repo: https://github.com/n8n-io/n8n
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/n8n-io/n8n git:
        commands:
        - /usr/bin/env sh .sqa/script.mango_timid_elephant.sh
        container: qc.acc_linen_observant_unicorn
  QC.Doc:
    repos:
      github.com/n8n-io/n8n find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.navy_exuberant_penguin.sh
        container: qc.doc_walnut_confused_barracuda
      github.com/n8n-io/n8n git:
        commands:
        - /usr/bin/env sh .sqa/script.purple_practical_penguin.sh
        container: qc.doc_royal_careful_roc
      github.com/n8n-io/n8n markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.lavender_tactful_impala.sh
        container: qc.doc_green_graceful_beaver
  QC.Lic:
    repos:
      github.com/n8n-io/n8n licensee:
        commands:
        - /usr/bin/env sh .sqa/script.mulberry_smart_porpoise.sh
        container: qc.lic_carmine_innocent_rhinoceros
  QC.Sec:
    repos:
      github.com/n8n-io/n8n bandit:
