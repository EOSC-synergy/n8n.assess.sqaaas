        - /usr/bin/env sh .sqa/script.fuchsia_humorous_grizzly.sh
        container: qc.sec_avocado_anxious_komodo
  QC.Sty:
    repos:
      github.com/n8n-io/n8n flake8:
        commands:
        - /usr/bin/env sh .sqa/script.tangerine_zany_snail.sh
        container: qc.sty_mint_cheerful_turkey
      github.com/n8n-io/n8n hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.chestnut_balanced_otter.sh
        container: qc.sty_marigold_tenacious_anaconda
      github.com/n8n-io/n8n jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.vermilion_witty_horse.sh
        container: qc.sty_maroon_compassionate_griffin
  QC.Uni:
    repos:
      github.com/n8n-io/n8n pytest:
        commands:
        - /usr/bin/env sh .sqa/script.mauve_patient_osprey.sh
        container: qc.uni_poppy_nurturing_hawk
